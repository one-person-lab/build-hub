services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # 构建期烤进预渲染页的 og:url / og:image
        SITE_URL: https://buildhub.cn
    image: build-hub:latest
    container_name: build-hub
    restart: unless-stopped
    ports:
      # host 3100 fixed: smzs-server nginx proxies buildhub.cn -> 127.0.0.1:3100
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DATA_PATH=/app/data/buildhub.db
    volumes:
      - buildhub-data:/app/data
      # 商户 API 证书私钥只留在服务器本地，只读挂进容器
      - ./secrets:/app/secrets:ro
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    healthcheck:
      # runner 镜像是 slim 底，没有 wget/curl，只能用 node 自带的 fetch 探活
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: build-hub:dev
    container_name: build-hub-dev
    restart: unless-stopped
    ports:
      - "${DEV_PORT:-3001}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  buildhub-data:
