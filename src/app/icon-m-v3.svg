<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#0D0D0D"/>
  <g fill="#FFFFFF">
    <!-- 第1行：左右腿顶（中间留缺口） -->
    <rect x="100" y="100" width="36" height="36" rx="9" opacity="1"/>
    <rect x="146" y="100" width="36" height="36" rx="9" opacity="1"/>
    <rect x="330" y="100" width="36" height="36" rx="9" opacity="1"/>
    <rect x="376" y="100" width="36" height="36" rx="9" opacity="1"/>
    <!-- 第2行：左右腿（缺口延续） -->
    <rect x="100" y="146" width="36" height="36" rx="9" opacity="1"/>
    <rect x="146" y="146" width="36" height="36" rx="9" opacity="1"/>
    <rect x="330" y="146" width="36" height="36" rx="9" opacity="1"/>
    <rect x="376" y="146" width="36" height="36" rx="9" opacity="1"/>
    <!-- 第3行：V 两臂斜切入（中央留空） -->
    <rect x="100" y="192" width="36" height="36" rx="9" opacity="1"/>
    <rect x="146" y="192" width="36" height="36" rx="9" opacity="1"/>
    <rect x="192" y="192" width="36" height="36" rx="9" opacity="1"/>
    <rect x="284" y="192" width="36" height="36" rx="9" opacity="1"/>
    <rect x="330" y="192" width="36" height="36" rx="9" opacity="1"/>
    <rect x="376" y="192" width="36" height="36" rx="9" opacity="1"/>
    <!-- 第4行：V 谷底（中央收点） -->
    <rect x="100" y="238" width="36" height="36" rx="9" opacity="1"/>
    <rect x="146" y="238" width="36" height="36" rx="9" opacity="1"/>
    <rect x="192" y="238" width="36" height="36" rx="9" opacity="1"/>
    <rect x="238" y="238" width="36" height="36" rx="9" opacity="1"/>
    <rect x="284" y="238" width="36" height="36" rx="9" opacity="1"/>
    <rect x="330" y="238" width="36" height="36" rx="9" opacity="1"/>
    <rect x="376" y="238" width="36" height="36" rx="9" opacity="1"/>
    <!-- 第5行：左右腿 -->
    <rect x="100" y="284" width="36" height="36" rx="9" opacity="1"/>
    <rect x="146" y="284" width="36" height="36" rx="9" opacity="1"/>
    <rect x="330" y="284" width="36" height="36" rx="9" opacity="1"/>
    <rect x="376" y="284" width="36" height="36" rx="9" opacity="1"/>
    <!-- 第6行：左右腿 -->
    <rect x="100" y="330" width="36" height="36" rx="9" opacity="1"/>
    <rect x="146" y="330" width="36" height="36" rx="9" opacity="1"/>
    <rect x="330" y="330" width="36" height="36" rx="9" opacity="1"/>
    <rect x="376" y="330" width="36" height="36" rx="9" opacity="1"/>
    <!-- 第7行：左右腿底 -->
    <rect x="100" y="376" width="36" height="36" rx="9" opacity="1"/>
    <rect x="146" y="376" width="36" height="36" rx="9" opacity="1"/>
    <rect x="330" y="376" width="36" height="36" rx="9" opacity="1"/>
    <rect x="376" y="376" width="36" height="36" rx="9" opacity="1"/>
  </g>
