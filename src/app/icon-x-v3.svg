    <rect x="284" y="284" width="36" height="36" rx="9" opacity="0.85"/>
    <!-- 第6行 (y=330) -->
    <rect x="146" y="330" width="36" height="36" rx="9" opacity="0.76"/>
    <rect x="192" y="330" width="36" height="36" rx="9" opacity="0.70"/>
    <rect x="330" y="330" width="36" height="36" rx="9" opacity="0.70"/>
    <rect x="376" y="330" width="36" height="36" rx="9" opacity="0.76"/>
    <!-- 第7行 (y=376) -->
    <rect x="100" y="376" width="36" height="36" rx="9" opacity="0.55"/>
