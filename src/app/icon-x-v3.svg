    <!-- 第4行 (y=238)，中心交叉 -->
    <rect x="192" y="238" width="36" height="36" rx="9" opacity="0.89"/>
    <rect x="238" y="238" width="36" height="36" rx="9" opacity="1"/>
    <rect x="284" y="238" width="36" height="36" rx="9" opacity="0.89"/>
    <!-- 第5行 (y=284) -->
    <rect x="192" y="284" width="36" height="36" rx="9" opacity="0.85"/>
