<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>auth-2 · Split sign-in with OAuth buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#000; --fg:#fff; --muted:#8a8a8a; --line:#242424; --input:#141414;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--fg);
    font-family:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    display:grid;grid-template-columns:433px 1fr;
    padding:64px 86px 46px;gap:0;overflow:hidden;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- left artwork panel ---------- */
  .art{
    position:relative;border-radius:16px;overflow:hidden;
    background:#eaf6fa;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:26px 28px 30px;
  }
  .art .layer{position:absolute;inset:0}
  /* soft light base */
  .l-base{
    background:
      radial-gradient(120% 90% at 10% 110%, #dff3f8 0%, transparent 60%),
      radial-gradient(90% 80% at 85% 0%, #ffffff 0%, transparent 55%),
      linear-gradient(180deg,#e4f3f8,#d9eef6);
  }
  /* cyan blob mass */
  .l-blob{
    background:
      radial-gradient(46% 54% at 44% 30%, #03bde8 0%, #06b6de 38%, rgba(6,182,222,.55) 62%, rgba(6,182,222,0) 80%),
      radial-gradient(40% 46% at 24% 54%, #02b0d8 0%, rgba(2,176,216,0) 76%),
      radial-gradient(34% 38% at 68% 40%, #56dcf2 0%, rgba(86,220,242,0) 74%),
      radial-gradient(30% 34% at 48% 78%, #0aa6cd 0%, rgba(10,166,205,0) 72%);
    filter:blur(8px);
    opacity:1;
  }
  /* halftone dither texture */
  .l-dots{
    background-image:radial-gradient(circle, rgba(0,96,128,.75) .9px, transparent 1.1px);
    background-size:3px 3px;
    mix-blend-mode:multiply;opacity:.55;
    -webkit-mask-image:radial-gradient(66% 70% at 46% 40%, #000 6%, rgba(0,0,0,.55) 55%, transparent 82%);
    mask-image:radial-gradient(66% 70% at 46% 40%, #000 6%, rgba(0,0,0,.55) 55%, transparent 82%);
  }
  /* flowing displacement streaks */
  .l-streak{
    background:
      repeating-radial-gradient(ellipse 62% 68% at 40% 34%, rgba(255,255,255,.5) 0 1px, transparent 1px 5px),
      repeating-radial-gradient(ellipse 40% 44% at 66% 58%, rgba(255,255,255,.35) 0 1px, transparent 1px 4px);
    mix-blend-mode:soft-light;opacity:.75;
    filter:blur(.3px);
    -webkit-mask-image:radial-gradient(64% 68% at 47% 40%, #000 10%, rgba(0,0,0,.4) 60%, transparent 82%);
    mask-image:radial-gradient(64% 68% at 47% 40%, #000 10%, rgba(0,0,0,.4) 60%, transparent 82%);
  }
  .art-top{position:relative;z-index:2;display:flex;align-items:center;gap:9px}
  .mark{
    width:24px;height:24px;border-radius:7px;background:#fff;display:grid;place-items:center;
    box-shadow:0 1px 2px rgba(0,0,0,.12);
  }
  .art-top span{font-size:15px;font-weight:600;color:#0c2a33;letter-spacing:-.01em}
  .art-copy{position:relative;z-index:2}
  .art-copy h2{
    font-size:26px;line-height:1.22;font-weight:600;letter-spacing:-.02em;color:#0b2b34;
    max-width:240px;
  }

  /* ---------- right form panel ---------- */
  .panel{display:grid;place-items:center;padding:0 40px}
  .form{width:100%;max-width:320px}
  .form h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-bottom:22px}
  .oauth{display:flex;flex-direction:column;gap:9px}
  .btn-oauth{
    height:38px;border-radius:9px;border:1px solid var(--line);background:#141414;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:12.5px;font-weight:500;color:#f2f2f2;
    transition:background .15s,border-color .15s;
  }
  .btn-oauth:hover{background:#1b1b1b;border-color:#333}
  .btn-oauth svg{width:14px;height:14px;flex:0 0 auto}
  .divider{
    display:flex;align-items:center;gap:12px;margin:18px 0;
    color:#6f6f6f;font-size:11px;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#232323}
  .field{margin-bottom:9px}
  .input-wrap{position:relative}
  .input-wrap input{
    width:100%;height:38px;border-radius:9px;background:var(--input);
    border:1px solid var(--line);color:#fff;font-family:inherit;font-size:12.5px;
    padding:0 12px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .input-wrap input::placeholder{color:#6b6b6b}
  .input-wrap input:focus{border-color:#3a3a3a;box-shadow:0 0 0 3px rgba(255,255,255,.05)}
  .input-wrap.has-icon input{padding-right:38px}
  .eye{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:24px;height:24px;display:grid;place-items:center;color:#7a7a7a;border-radius:6px;
  }
  .eye:hover{color:#cfcfcf}
  .btn-primary{
    width:100%;height:38px;border-radius:9px;background:#fff;color:#0a0a0a;
    font-size:13px;font-weight:600;display:grid;place-items:center;margin-top:4px;
  }
  .btn-primary:hover{opacity:.9}
  .links{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:9px}
  .links a{font-size:11.5px;color:#8f8f8f}
  .links a b{color:#fff;font-weight:500}
  .links a:hover{color:#d8d8d8}

  @media (max-width:820px){
    body{grid-template-columns:1fr;padding:0;overflow:auto}
    .art{min-height:280px;border-radius:0}
    .panel{padding:40px 24px 56px}
  }
</style>
</head>
<body>
  <div class="art">
    <div class="layer l-base"></div>
    <div class="layer l-blob"></div>
    <div class="layer l-streak"></div>
    <div class="layer l-dots"></div>

    <div class="art-top">
      <span class="mark">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="#0a0a0a">
          <rect x="6.4" y="1" width="3.2" height="14" rx="1.6"/>
          <rect x="1" y="6.4" width="14" height="3.2" rx="1.6"/>
        </svg>
      </span>
      <span>Brand</span>
    </div>

    <div class="art-copy">
      <h2>Your personal<br>cloud &amp; AI</h2>
    </div>
  </div>

  <div class="panel">
    <div class="form">
      <h1>Sign in</h1>

      <div class="oauth">
        <button class="btn-oauth" type="button">
          <svg viewBox="0 0 24 24" fill="#fff"><path d="M16.36 12.9c.02-2.2 1.79-3.26 1.87-3.31-1.02-1.5-2.61-1.7-3.17-1.73-1.35-.14-2.63.79-3.32.79-.69 0-1.74-.77-2.86-.75-1.47.02-2.83.86-3.58 2.18-1.53 2.66-.39 6.6 1.09 8.76.72 1.05 1.58 2.23 2.71 2.19 1.09-.04 1.5-.7 2.82-.7 1.31 0 1.69.7 2.83.68 1.17-.02 1.91-1.07 2.62-2.12.83-1.22 1.17-2.4 1.19-2.46-.03-.01-2.27-.87-2.2-3.44zM14.2 6.3c.6-.73 1-1.74.89-2.75-.86.04-1.9.57-2.52 1.29-.55.64-1.03 1.67-.9 2.66.96.07 1.93-.49 2.53-1.2z"/></svg>
          Sign in with Apple
        </button>
        <button class="btn-oauth" type="button">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.85-.08-1.66-.22-2.44H12v4.62h6.45a5.5 5.5 0 0 1-2.38 3.6v3h3.84c2.25-2.07 3.59-5.12 3.59-8.78z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.85-3a7.2 7.2 0 0 1-4.08 1.17c-3.13 0-5.78-2.11-6.73-4.96H1.3v3.09A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l3.97-3.1z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.7 0 3.99 2.47 1.3 6.6l3.97 3.1C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
          Sign in with Google
        </button>
      </div>

      <div class="divider">or</div>

      <form onsubmit="event.preventDefault()">
        <div class="field">
          <div class="input-wrap"><input type="email" placeholder="Email" autocomplete="email" /></div>
        </div>
        <div class="field">
          <div class="input-wrap has-icon">
            <input type="password" placeholder="Password" autocomplete="current-password" />
            <button class="eye" type="button" aria-label="Show password" onclick="togglePw(this)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                <path d="M3 3l18 18"/><path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c5 0 9 4.5 9 7 0 .9-.5 2-1.4 3.2"/>
                <path d="M6.2 6.7C4.2 8.2 3 10.2 3 12c0 2.5 4 7 9 7 1.6 0 3-.4 4.3-1.1"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </button>
          </div>
        </div>
        <button class="btn-primary" type="submit">Sign in</button>
      </form>

      <div class="links">
        <a href="#">Forgot password?</a>
        <a href="#">No account? <b>Sign up</b></a>
      </div>
    </div>
  </div>

<script>
  function togglePw(btn){
    const input = btn.parentElement.querySelector('input');
    input.type = input.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
