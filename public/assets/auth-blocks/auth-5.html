<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>auth-5 · Magic link sign-in with an inbox state</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
<style>
  :root{--fg:#fff;--muted:#8a8a8a;--line:#262626;--card:#141414}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#0a0a0a;color:var(--fg);
    font-family:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    display:grid;place-items:center;padding:40px;overflow:hidden;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  .wrap{width:100%;max-width:295px}
  .card{
    background:var(--card);border:1px solid #232323;border-radius:16px;
    padding:24px;box-shadow:0 40px 80px -40px rgba(0,0,0,.9);
  }
  .mark{
    width:26px;height:26px;border-radius:8px;background:#fff;
    display:grid;place-items:center;margin-bottom:18px;
  }
  h1{font-size:19px;font-weight:600;letter-spacing:-.02em}
  .sub{font-size:10.6px;color:var(--muted);margin-top:5px;line-height:1.5;letter-spacing:-.005em;white-space:nowrap}

  .field{margin-top:18px}
  .field label{display:block;font-size:11px;color:#d6d6d6;font-weight:500;margin-bottom:6px}
  input{
    width:100%;height:38px;border-radius:8px;background:#1b1b1b;
    border:1px solid #2b2b2b;color:#fff;font-family:inherit;font-size:12px;
    padding:0 12px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input::placeholder{color:#717171}
  input:focus{border-color:#4b4b4b;box-shadow:0 0 0 3px rgba(255,255,255,.06)}

  .btn-primary{
    width:100%;height:38px;border-radius:8px;background:#fff;color:#0a0a0a;
    font-size:12.5px;font-weight:600;display:grid;place-items:center;margin-top:10px;
  }
  .btn-primary:hover{opacity:.9}

  .divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:#6f6f6f;font-size:10.5px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#262626}

  .oauth{display:flex;flex-direction:column;gap:8px}
  .btn-oauth{
    height:36px;border-radius:8px;border:1px solid #2d2d2d;background:#161616;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:11.5px;font-weight:500;color:#ececec;transition:background .15s,border-color .15s;
  }
  .btn-oauth:hover{background:#1e1e1e;border-color:#3a3a3a}
  .btn-oauth svg{width:13px;height:13px}

  .below{text-align:center;margin-top:22px}
  .below .row1{font-size:11.5px;color:#8f8f8f}
  .below .row1 a{color:#fff}
  .below .row1 a:hover{text-decoration:underline}
  .below .row2{font-size:10px;color:#6b6b6b;margin-top:10px;line-height:1.6}
  .below .row2 a{color:#9e9e9e;text-decoration:underline;text-decoration-color:#4a4a4a;text-underline-offset:2px}
  .below .row2 a:hover{color:#e6e6e6}

  /* ---- inbox state ---- */
  .inbox{display:none;text-align:center;padding:10px 2px 4px}
  .card.sent form,.card.sent .divider,.card.sent .oauth{display:none}
  .card.sent .inbox{display:block}
  .inbox .icon{
    width:44px;height:44px;border-radius:12px;margin:0 auto 18px;
    background:#1f1f1f;border:1px solid #2e2e2e;display:grid;place-items:center;color:#e9e9e9;
  }
  .inbox h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .inbox p{font-size:11.5px;color:#8a8a8a;margin-top:7px;line-height:1.6}
  .inbox p b{color:#e8e8e8;font-weight:500}
  .inbox .resend{
    width:100%;height:38px;border-radius:8px;border:1px solid #2d2d2d;background:#191919;
    font-size:12px;font-weight:500;color:#eaeaea;margin-top:18px;
  }
  .inbox .resend:hover{background:#212121}
  .inbox .alt{display:block;font-size:11px;color:#8a8a8a;margin-top:12px}
  .inbox .alt:hover{color:#fff}

  @media (max-width:420px){
    body{padding:24px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="mark">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="#0a0a0a">
          <path d="M8 0l1.9 6.1L16 8l-6.1 1.9L8 16l-1.9-6.1L0 8l6.1-1.9L8 0z"/>
        </svg>
      </div>

      <h1>Sign in to Lumen</h1>
      <p class="sub">We'll email you a magic link. No password needed.</p>

      <form onsubmit="event.preventDefault(); document.getElementById('card').classList.add('sent');">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="you@company.com" autocomplete="email" />
        </div>
        <button class="btn-primary" type="submit">Send magic link</button>
      </form>

      <div class="divider">OR</div>

      <div class="oauth">
        <button class="btn-oauth" type="button">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.85-.08-1.66-.22-2.44H12v4.62h6.45a5.5 5.5 0 0 1-2.38 3.6v3h3.84c2.25-2.07 3.59-5.12 3.59-8.78z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.85-3a7.2 7.2 0 0 1-4.08 1.17c-3.13 0-5.78-2.11-6.73-4.96H1.3v3.09A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l3.97-3.1z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.7 0 3.99 2.47 1.3 6.6l3.97 3.1C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
          Continue with Google
        </button>
        <button class="btn-oauth" type="button">
          <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.6 4.6 18.6 5 18.6 5c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3z"/></svg>
          Continue with GitHub
        </button>
      </div>

      <!-- inbox state -->
      <div class="inbox">
        <div class="icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <rect x="2.5" y="5" width="19" height="14" rx="3"/>
            <path d="M3.5 7.5l7.3 5.2a2 2 0 0 0 2.4 0l7.3-5.2"/>
          </svg>
        </div>
        <h2>Check your inbox</h2>
        <p>We sent a sign-in link to <b id="sentTo">you@company.com</b>.<br>It expires in 10 minutes.</p>
        <button class="resend" type="button">Resend link</button>
        <a class="alt" href="#" onclick="event.preventDefault(); document.getElementById('card').classList.remove('sent')">Use a different email</a>
      </div>
    </div>

    <div class="below">
      <p class="row1">New to Lumen? <a href="#">Create an account</a></p>
      <p class="row2">By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
    </div>
  </div>

<script>
  document.getElementById('email').addEventListener('input', e => {
    if (e.target.value.trim()) document.getElementById('sentTo').textContent = e.target.value.trim();
  });
</script>
</body>
</html>
