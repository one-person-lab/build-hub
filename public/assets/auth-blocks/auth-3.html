<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>auth-3 · Centered sign-in card over an image</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
<style>
  :root{--fg:#fff;--muted:#8d8d8d;--line:#2b2b2b;--input:#0e0e0e}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#000;color:var(--fg);
    font-family:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding:57px 66px 38px 76px;overflow:hidden;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  .scene{
    position:relative;height:100%;border-radius:8px;overflow:hidden;
    background:#04121c;isolation:isolate;
  }
  /* --- abstract ocean / light-sheet background --- */
  .scene::before{
    content:"";position:absolute;inset:-10%;
    background:
      radial-gradient(46% 40% at 90% -4%, rgba(235,253,255,.98) 0%, rgba(130,226,250,.7) 26%, rgba(26,140,186,.2) 58%, transparent 76%),
      radial-gradient(34% 46% at 98% 42%, rgba(70,196,232,.55) 0%, transparent 68%),
      radial-gradient(40% 44% at 8% 16%, rgba(10,74,124,.9) 0%, transparent 72%),
      radial-gradient(56% 44% at 92% 92%, rgba(26,132,176,.6) 0%, transparent 68%),
      radial-gradient(48% 40% at 30% 86%, rgba(6,48,86,.95) 0%, transparent 72%),
      linear-gradient(158deg,#0b3a58 0%,#02101a 30%,#062736 58%,#01080e 100%);
  }
  /* light streaks */
  .scene::after{
    content:"";position:absolute;inset:-20%;
    background:
      linear-gradient(112deg, transparent 30%, rgba(190,245,255,.20) 37%, transparent 41%),
      linear-gradient(118deg, transparent 47%, rgba(140,228,255,.16) 53%, transparent 57%),
      linear-gradient(126deg, transparent 62%, rgba(110,214,250,.13) 69%, transparent 73%),
      linear-gradient(100deg, transparent 16%, rgba(160,235,255,.12) 20%, transparent 24%);
    filter:blur(10px);
    mix-blend-mode:screen;
  }

  .stage{position:relative;z-index:2;height:100%}

  /* --- sign-in card --- */
  .card{
    position:absolute;left:181px;top:50%;transform:translateY(-50%);
    width:315px;
    background:rgba(10,10,10,.93);
    border:1px solid rgba(255,255,255,.07);
    border-radius:16px;
    padding:24px 22px 22px;
    backdrop-filter:blur(14px);
    box-shadow:0 30px 70px -30px rgba(0,0,0,.9);
  }
  .card h1{font-size:20px;font-weight:600;letter-spacing:-.02em}
  .card .sub{font-size:11.5px;color:var(--muted);margin-top:5px}
  .card .sub a{color:#eee}
  .card .sub a:hover{text-decoration:underline}

  form{margin-top:18px}
  .input-wrap{position:relative}
  input{
    width:100%;height:38px;border-radius:8px;background:var(--input);
    border:1px solid var(--line);color:#fff;font-family:inherit;font-size:12.5px;
    padding:0 12px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input::placeholder{color:#767676}
  input:focus{border-color:#4a4a4a;box-shadow:0 0 0 3px rgba(255,255,255,.06)}

  .btn-primary{
    width:100%;height:38px;border-radius:8px;background:#fff;color:#0a0a0a;
    font-size:13px;font-weight:600;display:grid;place-items:center;margin-top:10px;
  }
  .btn-primary:hover{opacity:.9}

  .divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:#6f6f6f;font-size:11px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#262626}

  .oauth{display:flex;flex-direction:column;gap:8px}
  .btn-oauth{
    height:34px;border-radius:7px;border:1px solid #2e2e2e;background:#141414;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:11.5px;font-weight:500;color:#eaeaea;transition:background .15s,border-color .15s;
  }
  .btn-oauth:hover{background:#1c1c1c;border-color:#3a3a3a}
  .btn-oauth svg{width:13px;height:13px;flex:0 0 auto}

  .more{display:block;text-align:center;font-size:11.5px;color:#b9b9b9;margin-top:14px}
  .more:hover{color:#fff}
  .help{text-align:center;font-size:11px;color:#7c7c7c;margin-top:12px}
  .help a{color:#dcdcdc}

  /* --- right copy --- */
  .copy{position:absolute;left:529px;top:50%;transform:translateY(-50%);max-width:300px}
  .copy h2{font-size:25px;font-weight:500;letter-spacing:-.02em}
  .copy p{font-size:12.5px;color:#c9d6dd;margin-top:10px;line-height:1.6;max-width:250px}

  @media (max-width:820px){
    body{padding:0;overflow:auto}
    .scene{border-radius:0;min-height:100vh;padding:40px 0}
    .stage{grid-template-columns:1fr;gap:32px;justify-items:center}
    .card{margin:0;width:min(340px,calc(100vw - 48px))}
    .copy{padding:0;text-align:center}
    .copy p{margin-left:auto;margin-right:auto}
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="stage">
      <div class="card">
        <h1>Sign in</h1>
        <p class="sub">New user? <a href="#">Create an account</a></p>

        <form onsubmit="event.preventDefault()">
          <div class="input-wrap">
            <input type="email" placeholder="Email address" autocomplete="email" />
          </div>
          <button class="btn-primary" type="submit">Continue</button>
        </form>

        <div class="divider">Or</div>

        <div class="oauth">
          <button class="btn-oauth" type="button">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.85-.08-1.66-.22-2.44H12v4.62h6.45a5.5 5.5 0 0 1-2.38 3.6v3h3.84c2.25-2.07 3.59-5.12 3.59-8.78z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.85-3a7.2 7.2 0 0 1-4.08 1.17c-3.13 0-5.78-2.11-6.73-4.96H1.3v3.09A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l3.97-3.1z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.7 0 3.99 2.47 1.3 6.6l3.97 3.1C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
            Sign in with Google
          </button>
          <button class="btn-oauth" type="button">
            <svg viewBox="0 0 24 24" fill="#fff"><path d="M16.36 12.9c.02-2.2 1.79-3.26 1.87-3.31-1.02-1.5-2.61-1.7-3.17-1.73-1.35-.14-2.63.79-3.32.79-.69 0-1.74-.77-2.86-.75-1.47.02-2.83.86-3.58 2.18-1.53 2.66-.39 6.6 1.09 8.76.72 1.05 1.58 2.23 2.71 2.19 1.09-.04 1.5-.7 2.82-.7 1.31 0 1.69.7 2.83.68 1.17-.02 1.91-1.07 2.62-2.12.83-1.22 1.17-2.4 1.19-2.46-.03-.01-2.27-.87-2.2-3.44zM14.2 6.3c.6-.73 1-1.74.89-2.75-.86.04-1.9.57-2.52 1.29-.55.64-1.03 1.67-.9 2.66.96.07 1.93-.49 2.53-1.2z"/></svg>
            Sign in with Apple
          </button>
          <button class="btn-oauth" type="button">
            <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.6 4.6 18.6 5 18.6 5c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3z"/></svg>
            Sign in with GitHub
          </button>
        </div>

        <a class="more" href="#">View more</a>
        <p class="help">Can't sign in? <a href="#">Get help</a></p>
      </div>

      <div class="copy">
        <h2>React Bits Pro</h2>
        <p>Beautiful, production-ready components for your next project.</p>
      </div>
    </div>
  </div>
</body>
</html>
