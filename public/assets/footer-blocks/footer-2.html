<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>footer-2 · Centered sheet over a photo</title>
<style>
  :root{--fg:#111;--muted:#6f6f6f}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px;line-height:1.5;color:var(--fg);
    -webkit-font-smoothing:antialiased;overflow:hidden;position:relative;
    /* 现场照片的位置用分层渐变占位，避免运行时直链第三方图片 */
    background:
      linear-gradient(103deg, rgba(255,255,255,.16) 0 12%, transparent 12% 26%, rgba(255,255,255,.1) 26% 33%, transparent 33%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 2px, transparent 2px 26px),
      linear-gradient(160deg, #6d6862 0%, #3a3733 42%, #211f1d 100%);
  }
  a{color:inherit;text-decoration:none}

  .sheet{
    position:absolute;left:0;right:0;bottom:0;height:63%;
    background:#fff;padding:56px 40px 0;text-align:center;
  }
  /* 面板两端翘起的「肩」：白底从两侧向下凹进照片里 */
  .sheet::before,.sheet::after{
    content:"";position:absolute;top:-46px;width:66px;height:46px;background:#fff;
  }
  .sheet::before{
    left:0;border-top-right-radius:46px;
  }
  .sheet::after{
    right:0;border-top-left-radius:46px;
  }

  .name{font-size:74px;font-weight:800;letter-spacing:-.055em;line-height:1}
  .sub-name{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}

  .links{
    margin-top:38px;display:flex;align-items:center;justify-content:center;gap:22px;
    font-size:14px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;
  }
  .links i{width:26px;height:1px;background:#c9c9c9;display:block}
  .links a{transition:opacity .15s}
  .links a:hover{opacity:.6}

  .socials{margin-top:30px;display:flex;justify-content:center;gap:24px;color:#1b1b1b}
  .socials a{display:grid;place-items:center;transition:opacity .15s}
  .socials a:hover{opacity:.55}

  .legal{
    position:absolute;left:0;right:0;bottom:26px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 46px;font-size:12px;color:var(--muted);
  }
  .tags{display:flex;gap:26px;font-size:10.5px;letter-spacing:.16em;color:#4d4d4d;text-transform:uppercase}
</style>
</head>
<body>
  <div class="sheet">
    <div class="name">frequency</div>
    <div class="sub-name">studios</div>

    <div class="links">
      <a href="#">Book session</a><i></i><a href="#">Join waitlist</a>
    </div>

    <div class="socials">
      <a href="#" aria-label="Instagram">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="#" aria-label="X">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 3h3.2l-7 8 7.3 10h-5.7l-4.5-6.2L5.6 21H2.4l7.5-8.6L2.6 3h5.8l4.2 5.9L17.5 3Zm-1.1 16.1h1.8L7.7 4.8H5.8l10.6 14.3Z"/></svg>
      </a>
      <a href="#" aria-label="LinkedIn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5A2.5 2.5 0 1 0 5 8.5a2.5 2.5 0 0 0 0-5ZM3 9.75h4v11H3v-11Zm6.5 0h3.8v1.5h.06c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.77 2.5 4.77 5.75v5.7h-4v-5.05c0-1.2-.02-2.75-1.75-2.75-1.75 0-2.02 1.32-2.02 2.67v5.13h-4v-11Z"/></svg>
      </a>
    </div>
  </div>

  <div class="legal">
    <span>© 2024 Frequency Studios. All rights reserved.</span>
    <span class="tags"><b>Analog &amp; digital</b><b>Grammy-winning engineers</b><b>Est. 2017</b></span>
  </div>
</body>
</html>
